name: Apply CKF live update

on:
  push:
    paths:
      - '.github/workflows/ckf-live-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply update
        run: python scripts/update_ckf.py
      - name: Commit updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update CKF leadership, impact, and grant details"
          git push
